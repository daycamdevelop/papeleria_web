<div>
    <mat-card class="p30">
        <div class="flex-row w80">
            <mat-form-field appearance="outline" class="lower w30">
                <mat-label>Contraseña</mat-label>
                <input id="MyInput" matInput #input autocomplete="off" type="password"
                [(ngModel)]="password">
            </mat-form-field>
        </div>
        <div class="flex-row w80">
            <div class="w40">
                <button mat-raised-button color="primary" (click)="validar()">Licenciar</button>
            </div>
        </div>
        <br>
        <div class="flex-row w80">
            <div class="w40">
                <button mat-raised-button color="error" (click)="eliminar()">Eliminar licencia</button>
            </div>
        </div>
    </mat-card>
</div>
<app-loading *ngIf="loading"></app-loading>
