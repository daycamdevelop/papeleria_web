<div class="p5">
    <mat-card class="flex-row">
        <mat-card class="flex-column w100">
            
            <mat-card class="flex-column w100 noBorder">
                <mat-card-header class="noPadding">
                    <h2>UTILIDADES</h2>
                </mat-card-header>
                <mat-card-content class="border flex-row">
                    <div class="w30">
                        <img src="assets/images/UtilidadesReportes.png" alt="verificador" class="icon" (click)="navigateTo('ireportbools')"/>
                        <h3>IREPORTS BOOLS</h3>
                    </div>
                    <div class="w30">
                        <img src="assets/images/UtilidadesReportes.png" alt="verificador" class="icon" (click)="navigateTo('ireportcajas')"/>
                        <h3>IREPORTS CAJAS</h3>
                    </div>
                    <div class="w30">
                        <img src="assets/images/UtilidadesReportes.png" alt="verificador" class="icon" (click)="pendiente()"/>
                        <h3>REMISIONES</h3>
                    </div>
                    <div class="w30">
                        <img src="assets/images/Cierre.png" alt="verificador" class="icon" (click)="pendiente()"/>
                        <h3>AJUSTES</h3>
                    </div>
                    <div class="w30">
                        <img src="assets/images/Pago.png" alt="verificador" class="icon" (click)="pendiente()"/>
                        <h3>FACTURACION</h3>
                    </div>
                </mat-card-content>
            </mat-card>

            <mat-card class="flex-row">
                <mat-card class="flex-column w50 noBorder">
                    <mat-card-header class="noPadding">
                        <h2>UTILIDADES FACTURAS ELECTRONICAS</h2>
                    </mat-card-header>
                    <mat-card-content class="border flex-row">
                        <div class="w30">
                            <img src="assets/images/UtilidadesReportes.png" alt="verificador" class="icon" (click)="pendiente()"/>
                            <h3>IREPORTS</h3>
                        </div>
                    </mat-card-content>
                </mat-card>
                <mat-card class="flex-column w50 noBorder">
                    <mat-card-header class="noPadding">
                        <h2>UTILIDADES POS</h2>
                    </mat-card-header>
                    <mat-card-content class="border flex-row">
                        <div class="w30">
                            <img src="assets/images/UtilidadesReportes.png" alt="verificador" class="icon" (click)="pendiente()"/>
                            <h3>IREPORTS</h3>
                        </div>
                    </mat-card-content>
                </mat-card>
            </mat-card>

        </mat-card>
    </mat-card>
</div>
<app-loading *ngIf="loading"></app-loading>
