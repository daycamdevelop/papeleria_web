<div class="general">
    <h1 mat-dialog-title> Confirmación </h1>
    <mat-form-field appearance="outline">
        <mat-label>NUEVO VALOR</mat-label>
        <input matInput #MyInput [(ngModel)]="valor" 
        (focus)="MyInput.select()"
        (keydown.enter)="onClick()"
        (input)="formatearPrecio()">
    </mat-form-field>
    <div mat-dialog-actions>
        <button mat-button (click)="onClick()" cdkFocusInitial>Aceptar</button>
        <button mat-button (click)="onNoClick()">Cancelar</button>
    </div>
</div>
