<mat-card>
  <h2 class="alinear">Devoluciones</h2>
  <mat-card-content>
    <table mat-table [dataSource]="dataSource" class="mat-cell">

      <ng-container matColumnDef="numfact">
        <th mat-header-cell *matHeaderCellDef> # FACTURA </th>
        <td mat-cell *matCellDef="let element"> {{ element.numfact }}</td>
      </ng-container>

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let element"> {{ element.id }}</td>
      </ng-container>

      <ng-container matColumnDef="producto">
        <th mat-header-cell *matHeaderCellDef> CODIGO </th>
        <td mat-cell *matCellDef="let element"> {{ element.producto }}</td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> NOMBRE </th>
        <td mat-cell *matCellDef="let element"> {{ element.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="catidadproductos">
        <th mat-header-cell *matHeaderCellDef> CANTIDAD </th>
        <td mat-cell *matCellDef="let element"> {{ element.catidadproductos }}</td>
      </ng-container>

      <ng-container matColumnDef="precio_unitario">
        <th mat-header-cell *matHeaderCellDef> PRECIO </th>
        <td mat-cell *matCellDef="let element"> {{ element.precio_unitario }}</td>
      </ng-container>

      <ng-container matColumnDef="cantidaddevolver">
        <th mat-header-cell *matHeaderCellDef> CANTIDAD A DEVOLVER </th>
        <td mat-cell *matCellDef="let element"> 0 </td>
      </ng-container>

      <ng-container matColumnDef="preciototal">
        <th mat-header-cell *matHeaderCellDef> PRECIO TOTAL </th>
        <td mat-cell *matCellDef="let element"> {{ element.catidadproductos * element.precio_unitario }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10, 20, 30]" showFirstLastButtons></mat-paginator>
  </mat-card-content>
</mat-card>
<app-loading *ngIf="loading"></app-loading>
